<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="chart-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes pulseTraffic {
      0%, 100% { r: 4px; opacity: 0.7; }
      50% { r: 8px; opacity: 1; }
    }
    @keyframes scanWave {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    .orb-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .traffic-dot {
      animation: pulseTraffic 2.5s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .wave-line {
      stroke-dasharray: 8 8;
      animation: scanWave 20s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient Ambient Radial Glowing Orbs (Dynamic Background) -->
  <circle class="orb-glow" cx="180" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle class="orb-glow" cx="1020" cy="140" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)" style="animation-delay: -3s;"/>
  <circle class="orb-glow" cx="600" cy="300" r="180" fill="#c084fc" opacity="0.08" filter="url(#glow)" style="animation-delay: -1.5s;"/>

  <!-- Background Dynamic Traffic Graph Flow -->
  <g opacity="0.45">
    <path d="M 0 310 Q 150 250 300 280 T 600 200 T 900 160 T 1200 130 L 1200 360 L 0 360 Z" fill="url(#chart-area)"/>
    <path d="M 0 310 Q 150 250 300 280 T 600 200 T 900 160 T 1200 130" fill="none" stroke="url(#chart-line)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Secondary trend curve -->
    <path d="M 0 330 Q 200 290 400 300 T 800 240 T 1200 180" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Traffic Nodes (Live Visitors) -->
    <circle class="traffic-dot" cx="300" cy="280" r="5" fill="#38bdf8" style="animation-delay: 0s;"/>
    <circle class="traffic-dot" cx="600" cy="200" r="6" fill="#818cf8" style="animation-delay: -0.8s;"/>
    <circle class="traffic-dot" cx="900" cy="160" r="5" fill="#a855f7" style="animation-delay: -1.6s;"/>
    <circle class="traffic-dot" cx="1120" cy="140" r="6" fill="#38bdf8" style="animation-delay: -2.2s;"/>
  </g>

  <!-- Ambient Animated Data Floating Particles -->
  <circle class="particle" cx="120" cy="80" r="2.5" fill="#38bdf8" style="animation-delay: -1s;"/>
  <circle class="particle" cx="240" cy="110" r="1.5" fill="#818cf8" style="animation-delay: -3s;"/>
  <circle class="particle" cx="960" cy="70" r="2" fill="#c084fc" style="animation-delay: -2s;"/>
  <circle class="particle" cx="1080" cy="110" r="3" fill="#38bdf8" style="animation-delay: -4s;"/>

  <!-- Foreground Content: Clear, Prominent, Crisp Typography -->
  
  <!-- Pill Tag at Top -->
  <g transform="translate(600, 52)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="url(#badge-glow)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="-148" cy="0" r="4.5" fill="#10b981" filter="url(#glow)"/>
    <text x="-132" y="4" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">REAL-TIME VISITOR INSIGHTS &amp; PRIVACY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="128" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Website Traffic &amp; Visitor Analytics
  </text>
  
  <!-- Subtle Gradient Accent Bar Under Title -->
  <rect x="420" y="146" width="360" height="3" rx="1.5" fill="url(#primary-glow)"/>

  <!-- Subtitle Line 1 -->
  <text x="600" y="184" text-anchor="middle" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Curated Hub of Privacy-First, Open-Source &amp; Enterprise Analytics Stacks
  </text>

  <!-- Subtitle Line 2 -->
  <text x="600" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
    Google Analytics Alternatives • Cookieless Tracking • Self-Hosted Infrastructure • Funnel Intelligence
  </text>

  <!-- Metric Badges in Foreground (Bottom Pill Trio) -->
  <g transform="translate(600, 275)">
    <!-- Badge 1: GDPR Ready -->
    <g transform="translate(-240, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#badge-glow)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="600">🛡️ Cookieless &amp; GDPR</text>
    </g>

    <!-- Badge 2: Open Source -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#badge-glow)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">⚡ High Performance Stack</text>
    </g>

    <!-- Badge 3: 100% Data Sovereignty -->
    <g transform="translate(240, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#badge-glow)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#fae8ff" font-size="12" font-weight="600">🚀 100% Data Ownership</text>
    </g>
  </g>
</svg>
